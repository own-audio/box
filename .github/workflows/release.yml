# A tag v* builds ownbox for the Pi, signs it with the release key and publishes it as a
# GitHub Release; boxes offer it in Settings. Then image.yml builds the SD card image
# around it and attaches it to the same release.
# Needs: the repository variable OWNBOX_UPDATE_PUBKEY (the base64 line of the minisign
# .pub file, built into ownbox) and the secrets MINISIGN_KEY (the secret key file) and
# MINISIGN_PASSWORD.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Test
        run: cargo test
      - name: Build
        env:
          OWNBOX_UPDATE_PUBKEY: ${{ vars.OWNBOX_UPDATE_PUBKEY }}
        run: |
          test -n "$OWNBOX_UPDATE_PUBKEY"
          # The Pi has glibc 2.41 (Trixie); 2.36 keeps Bookworm working, as the deploy does.
          pip install ziglang==0.13.0 && cargo install cargo-zigbuild --locked
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.36
          cp target/aarch64-unknown-linux-gnu/release/ownbox ownbox-aarch64
          # The box's system files, which an update puts in place as well (the list and
          # where each goes are in setup/install-update.sh; the box ignores anything else).
          # Filled in for the image's user here: a box that updates itself runs an image
          # (a box deployed from source has no release key), and beta.7's installer leaves
          # the placeholder in place. A later installer finds nothing left to fill in.
          mkdir -p staged/image
          (cd setup && for f in boot-config.sh install-update.sh apply-sources.sh image/ownbox-boot.sh image/ownbox-boot.service \
            ownbox.service ownbox-kiosk.service ownbox-update.path ownbox-update.service ownbox-recover.service \
            ownbox-sources.path ownbox-sources.service squeezelite.service \
            50-ownbox-network.rules 51-ownbox-sources.rules ownbox-journald.conf ownbox-wifi-powersave.conf \
            dnsmasq-ownbox-setup.conf ownbox-brcmfmac.conf; do
            sed "s/@USER@/ownbox/g" "$f" > "../staged/$f"; chmod --reference="$f" "../staged/$f"
          done)
          if grep -rl '@USER@' staged; then echo 'placeholder left in the system files'; exit 1; fi
          tar -C staged --owner=0 --group=0 --sort=name -czf ownbox-setup.tar.gz \
            boot-config.sh install-update.sh apply-sources.sh image/ownbox-boot.sh image/ownbox-boot.service \
            ownbox.service ownbox-kiosk.service ownbox-update.path ownbox-update.service ownbox-recover.service \
            ownbox-sources.path ownbox-sources.service squeezelite.service \
            50-ownbox-network.rules 51-ownbox-sources.rules ownbox-journald.conf ownbox-wifi-powersave.conf \
            dnsmasq-ownbox-setup.conf ownbox-brcmfmac.conf
      - name: Sign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get install -y -q minisign
          printf '%s\n' "$MINISIGN_KEY" > minisign.key
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m ownbox-aarch64 -t "ownbox ${GITHUB_REF_NAME}"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m ownbox-setup.tar.gz -t "ownbox system files ${GITHUB_REF_NAME}"
          rm minisign.key
          sha256sum ownbox-aarch64 > ownbox-aarch64.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the version's section of CHANGELOG.md.
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          # A version with a "-" (1.0.0-beta.1) is a pre-release; boxes find it in the
          # release list all the same.
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" ownbox-aarch64 ownbox-aarch64.minisig ownbox-aarch64.sha256 \
            ownbox-setup.tar.gz ownbox-setup.tar.gz.minisig \
            --title "ownbox ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre
      - name: SD card image
        env:
          GH_TOKEN: ${{ github.token }}
        # Its own workflow (half an hour on its own runner); it attaches the image here.
        run: gh workflow run image.yml -f release="$GITHUB_REF_NAME" -f attach=true

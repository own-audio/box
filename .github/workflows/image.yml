# Builds the SD card image (setup/image/build.sh) around a released, signed ownbox: run by
# release.yml after each release, which attaches the image to it, or by hand to try one
# (attached to the run as an artifact for a few days).
name: image

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag whose ownbox goes in (e.g. v1.0.0-beta.1)"
        required: true
      attach:
        description: "Attach the image to that release (otherwise only to this run)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Released ownbox, signature checked
        # The release tag reaches the shell as a variable, never pasted into the script:
        # whoever runs the workflow types it.
        env:
          GH_TOKEN: ${{ github.token }}
          OWNBOX_UPDATE_PUBKEY: ${{ vars.OWNBOX_UPDATE_PUBKEY }}
          RELEASE: ${{ inputs.release }}
        run: |
          case "$RELEASE" in v[0-9]*) ;; *) echo "not a release tag: $RELEASE"; exit 1 ;; esac
          sudo apt-get install -y -q minisign zerofree parted
          gh release download "$RELEASE" -p 'ownbox-aarch64*' -D bin
          minisign -V -P "$OWNBOX_UPDATE_PUBKEY" -m bin/ownbox-aarch64
      - name: Build
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          version="${RELEASE#v}"
          echo "NAME=own-audio-box-$version-arm64.img.xz" >> "$GITHUB_ENV"
          sudo setup/image/build.sh bin/ownbox-aarch64 "$version" "own-audio-box-$version-arm64.img.xz"
      - name: Attach to the release
        if: inputs.attach
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: gh release upload "$RELEASE" "$NAME" "$NAME.sha256" --clobber
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.attach }}
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}
            ${{ env.NAME }}.sha256
          compression-level: 0
          retention-days: 5

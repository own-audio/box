# own.audio box: the Wi-Fi chip's own roaming stays off. On a Zero 2 W it kept moving to an
# access point it cannot join (a MikroTik WPA2/WPA3 network), and the box lost its network
# every few seconds. ownbox moves to a stronger access point itself (wifi::roam) and
# remembers one that refused it. Takes effect at the next boot.
options brcmfmac roamoff=1
